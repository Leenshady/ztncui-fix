# Upgrade without losing configuration:
#   git pull && docker compose up -d --build
# NEVER add `-v` to `docker compose down`: it deletes the volume below.
#
# All mutable state lives under one fixed data directory on that volume:
#   /var/lib/zerotier-one/ztncui-data/passwd          admin accounts
#   /var/lib/zerotier-one/ztncui-data/sessions        sessions
#   /var/lib/zerotier-one/ztncui-data/tls             TLS certificates
#   /var/lib/zerotier-one/ztncui-data/session.secret  session signing key
#   /var/lib/zerotier-one/ztncui-data/storage         member notes
#   /var/lib/zerotier-one/ztncui-data/.env            optional, see README
# These sub-paths are fixed; only ZTNCUI_DATA_DIR itself is configurable.
services:
  ztncui:
    build: .
    image: ztncui-fix:local
    container_name: ztncui-fix
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    volumes:
      - ztncui-data:/var/lib/zerotier-one
    # Optional: keep the env file on the host instead of on the volume.
    # env_file:
    #   - ./config/.env

volumes:
  ztncui-data:
